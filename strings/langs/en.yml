start_2: "<blockquote><b>ʜᴇʟʟᴏ ʙᴀʙʏ {0}, 🥀</b></blockquote>\n<blockquote expandable><b>ᴛʜɪs ɪs {1} : ᴄʟᴏɴᴇ ʀᴇᴀᴅʏ ᴍᴜsɪᴄ ʙᴏᴛ.\n\nsᴍᴏᴏᴛʜ ᴘʟᴀʏʙᴀᴄᴋ • sᴛᴀʙʟᴇ ᴠᴄ • ʟᴀɢ-ғʀᴇᴇ ᴍᴜsɪᴄ ғʟᴏᴡ.\nᴏᴘᴛɪᴍɪᴢᴇᴅ ᴡɪᴛʜ sᴜᴘᴀʀ-ғᴀsᴛ ʏᴏᴜᴛᴜʙᴇ ᴧᴘɪ ғᴏʀ ɪɴsᴛᴀɴᴛ ʀᴇsᴜʟᴛs.\n•── ⋅ ⋅ ⋅ ────── ⋅ ⋅ ────── ⋅ ⋅ ⋅ ──•\nᴡᴀɴɴᴀ ᴄʀᴇᴀᴛᴇ ʏᴏᴜʀ ᴏᴡɴ ᴍᴜsɪᴄ ʙᴏᴛ?\nᴜsᴇ /clone ᴄᴏᴍᴍᴀɴᴅ ᴛᴏ ᴄʟᴏɴᴇ ᴀ ᴍᴜsɪᴄ ʙᴏᴛ.\n➥ ɢᴇᴛ ʏᴏᴜʀ ᴏᴡɴ ʙᴏᴛ ɪɴ sᴇᴄᴏɴᴅs !\n•── ⋅ ⋅ ⋅ ────── ⋅ ⋅ ────── ⋅ ⋅ ⋅ ──•\nᴛᴧᴘ ᴛʜᴇ ʜᴇʟᴘ ʙᴜᴛᴛᴏɴ ᴛᴏ ᴇxᴘʟᴏʀᴇ ᴧʟʟ ғᴇᴀᴛᴜʀᴇs, ᴍᴏᴅᴜʟᴇs & ᴄᴏᴍᴍᴀɴᴅs.</b></blockquote>"
start_3: "<b>ʜєʏ {0},\nᴛʜɪs ɪs {1}\n\nᴛʜᴧηᴋs ғσʀ ᴧᴅᴅɪηɢ ϻє ɪη {2}, {3} ᴄᴧη ησᴡ ᴩʟᴧʏ sσηɢs ɪη ᴛʜɪs ᴄʜᴧᴛ.</b>"
